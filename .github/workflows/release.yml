name: Release clients

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '')
            let release
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              })
            } catch (error) {
              if (error.status !== 404) throw error
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `Prior ${tagName}`,
                body: 'Desktop and Android builds for Prior.',
                draft: true,
                prerelease: false,
              })
            }
            core.setOutput('release_id', String(release.data.id))

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - name: Install macOS universal target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      # A macOS build only opens without the Gatekeeper warning when it is signed with a
      # "Developer ID Application" certificate AND notarized. Both are mandatory here;
      # set the repository variable ALLOW_UNSIGNED_MACOS=true to knowingly ship an
      # ad-hoc build (local testing only). Secrets come from scripts/macos/setup-github-secrets.sh.
      # macOS 26 no longer reliably infers PKCS#12 when Tauri imports APPLE_CERTIFICATE,
      # so import it explicitly and let Tauri use the already-configured keychain.
      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          ALLOW_UNSIGNED_MACOS: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail
          . scripts/macos/lib.sh

          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            if [ "$ALLOW_UNSIGNED_MACOS" = "true" ]; then
              echo "::warning::ALLOW_UNSIGNED_MACOS=true: building an ad-hoc signed macOS app that WILL trigger the Gatekeeper warning."
              printf 'APPLE_SIGNING_IDENTITY=-\n' >> "$GITHUB_ENV"
              printf 'MACOS_REQUIRE_NOTARIZATION=0\n' >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets are missing. Run scripts/macos/setup-github-secrets.sh, or set the repository variable ALLOW_UNSIGNED_MACOS=true to ship an unsigned build on purpose." >&2
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be configured together" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/prior-signing.p12"
          keychain_path="$RUNNER_TEMP/prior-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 21600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          rm -f "$certificate_path"

          # Only a Developer ID Application identity passes Gatekeeper on other Macs.
          signing_identity="$(find_developer_id_identity "$keychain_path")"
          if [ -z "$signing_identity" ]; then
            echo "::error::APPLE_CERTIFICATE contains no 'Developer ID Application' identity (an 'Apple Development' certificate is not enough)." >&2
            security find-identity -v -p codesigning "$keychain_path" >&2 || true
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"
          echo "Signing with: $signing_identity"

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ]; then
            team_id="${APPLE_TEAM_ID:-$(team_id_from_identity "$signing_identity")}"
            printf 'APPLE_ID=%s\n' "$APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$team_id" >> "$GITHUB_ENV"
          elif [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
            printf 'APPLE_API_KEY=%s\n' "$APPLE_API_KEY" >> "$GITHUB_ENV"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          elif [ "$ALLOW_UNSIGNED_MACOS" = "true" ]; then
            echo "::warning::Notarization secrets are missing; the macOS app is signed but macOS will still warn on first launch."
            printf 'MACOS_REQUIRE_NOTARIZATION=0\n' >> "$GITHUB_ENV"
            exit 0
          else
            echo "::error::Notarization secrets are incomplete: set APPLE_ID + APPLE_PASSWORD (+ optional APPLE_TEAM_ID) or APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_BASE64. Without notarization macOS still shows the Gatekeeper warning." >&2
            exit 1
          fi
          printf 'MACOS_REQUIRE_NOTARIZATION=1\n' >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile=false
        working-directory: app
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      # Fail the release instead of shipping a macOS artifact that Gatekeeper would reject.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != '-'
        run: |
          set -euo pipefail
          . scripts/macos/lib.sh
          bundle_dir="app/src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "$app_path" ] || die "no .app found under $bundle_dir/macos"
          verify_app_bundle "$app_path" "${MACOS_REQUIRE_NOTARIZATION:-1}"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            [ -f "$dmg" ] && verify_dmg "$dmg"
          done

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006"
      - run: pnpm install --frozen-lockfile=false
        working-directory: app
      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for signed releases" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/src-tauri/gen/android/prior-release.keystore
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/src-tauri/gen/android/prior-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: app
        run: pnpm tauri android build --target aarch64 --apk
      - name: Upload Android APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            })
