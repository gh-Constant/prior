name: Release clients

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '')
            let release
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              })
            } catch (error) {
              if (error.status !== 404) throw error
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `Prior ${tagName}`,
                body: 'Desktop and Android builds for Prior.',
                draft: true,
                prerelease: false,
              })
            }
            core.setOutput('release_id', String(release.data.id))

  plan:
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      build_frontend: ${{ steps.plan.outputs.build_frontend }}
      build_desktop: ${{ steps.plan.outputs.build_desktop }}
      build_android: ${{ steps.plan.outputs.build_android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate changed release targets
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/plan.mjs

  # A platform-independent frontend bundle is built once. The cache key ignores
  # release-only version lines, so native-only releases reuse this bundle too.
  frontend:
    needs: plan
    if: needs.plan.outputs.build_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
        working-directory: app
      - uses: actions/cache@v4
        id: frontend-cache
        with:
          path: app/dist
          key: prior-web-dist-${{ hashFiles('app/src/**', 'app/public/**', 'app/index.html', 'app/vite.config.*', 'app/tsconfig*.json', 'pnpm-lock.yaml') }}
      - name: Build frontend bundle
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: pnpm build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: prior-web-dist
          path: app/dist
          if-no-files-found: error

  desktop:
    needs: [plan, frontend]
    if: needs.plan.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prior-web-dist
          path: app/dist
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - name: Install macOS universal target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      # A macOS build only opens without the Gatekeeper warning when it is signed with a
      # Developer ID Application certificate AND notarized. Both are mandatory here;
      # set the repository variable ALLOW_UNSIGNED_MACOS=true to knowingly ship an
      # ad-hoc build (local testing only). Secrets come from scripts/macos/setup-github-secrets.sh.
      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          ALLOW_UNSIGNED_MACOS: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail
          . scripts/macos/lib.sh

          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            if [ "$ALLOW_UNSIGNED_MACOS" = "true" ]; then
              echo "::warning::ALLOW_UNSIGNED_MACOS=true: building an ad-hoc signed macOS app that WILL trigger the Gatekeeper warning."
              printf 'APPLE_SIGNING_IDENTITY=-\n' >> "$GITHUB_ENV"
              printf 'MACOS_REQUIRE_NOTARIZATION=0\n' >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets are missing. Run scripts/macos/setup-github-secrets.sh, or set the repository variable ALLOW_UNSIGNED_MACOS=true to ship an unsigned build on purpose." >&2
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be configured together" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/prior-signing.p12"
          keychain_path="$RUNNER_TEMP/prior-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 21600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          rm -f "$certificate_path"

          signing_identity="$(find_developer_id_identity "$keychain_path")"
          if [ -z "$signing_identity" ]; then
            echo "::error::APPLE_CERTIFICATE contains no 'Developer ID Application' identity (an 'Apple Development' certificate is not enough)." >&2
            security find-identity -v -p codesigning "$keychain_path" >&2 || true
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"
          echo "Signing with: $signing_identity"

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ]; then
            team_id="${APPLE_TEAM_ID:-$(team_id_from_identity "$signing_identity")}"
            printf 'APPLE_ID=%s\n' "$APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$team_id" >> "$GITHUB_ENV"
          elif [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
            printf 'APPLE_API_KEY=%s\n' "$APPLE_API_KEY" >> "$GITHUB_ENV"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          elif [ "$ALLOW_UNSIGNED_MACOS" = "true" ]; then
            echo "::warning::Notarization secrets are missing; the macOS app is signed but macOS will still warn on first launch."
            printf 'MACOS_REQUIRE_NOTARIZATION=0\n' >> "$GITHUB_ENV"
            exit 0
          else
            echo "::error::Notarization secrets are incomplete: set APPLE_ID + APPLE_PASSWORD (+ optional APPLE_TEAM_ID) or APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_BASE64. Without notarization macOS still shows the Gatekeeper warning." >&2
            exit 1
          fi
          printf 'MACOS_REQUIRE_NOTARIZATION=1\n' >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile=false
        working-directory: app
      - name: Build signed desktop bundles
        working-directory: app
        run: pnpm tauri build --config src-tauri/tauri.release.json ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # Fail the release instead of shipping a macOS artifact that Gatekeeper would reject.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != '-'
        run: |
          set -euo pipefail
          . scripts/macos/lib.sh
          bundle_dir="app/src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "$app_path" ] || die "no .app found under $bundle_dir/macos"
          verify_app_bundle "$app_path" "${MACOS_REQUIRE_NOTARIZATION:-1}"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            [ -f "$dmg" ] && verify_dmg "$dmg"
          done
      - name: Collect desktop release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          find app/src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} release-output/ \;
          test -n "$(find release-output -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-output
          if-no-files-found: error

  android:
    needs: [plan, frontend]
    if: needs.plan.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prior-web-dist
          path: app/dist
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: prior-android-${{ runner.os }}-${{ hashFiles('app/src-tauri/gen/android/**', 'app/src-tauri/Cargo.lock') }}
          restore-keys: prior-android-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006"
      - run: pnpm install --frozen-lockfile=false
        working-directory: app
      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for signed releases" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/src-tauri/gen/android/prior-release.keystore
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/src-tauri/gen/android/prior-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: app
        run: pnpm tauri android build --target aarch64 --apk --config src-tauri/tauri.release.json
      - name: Collect Android release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          find app/src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -exec cp {} release-output/ \;
          test -n "$(find release-output -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-output
          if-no-files-found: error

  # GitHub release assets and latest.json are written by one job only. This
  # keeps parallel platform builds fast without reintroducing upload races.
  publish:
    needs: [prepare, plan, frontend, desktop, android]
    if: ${{ always() && needs.prepare.result == 'success' && needs.plan.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.build_desktop == 'true'
        with:
          pattern: desktop-*
          path: new-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.build_android == 'true'
        with:
          pattern: android-apk
          path: new-artifacts
          merge-multiple: true
      - name: Carry forward unchanged platform assets
        if: needs.plan.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mkdir -p reused-artifacts
          gh release download "$PREVIOUS_TAG" --dir reused-artifacts
          rm -f reused-artifacts/latest.json
      - name: Generate updater metadata for newly built platforms
        run: |
          mkdir -p new-artifacts release-assets
          node scripts/release/generate-latest-json.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --artifacts new-artifacts \
            --output release-assets/latest.json
      - name: Upload all release assets once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reused-artifacts new-artifacts release-assets
          # Keep unchanged files, then let newly-built files replace same-name
          # assets (notably the Android APK) before uploading the merged set.
          cp -a reused-artifacts/. release-assets/ 2>/dev/null || true
          cp -af new-artifacts/. release-assets/ 2>/dev/null || true
          upload_asset() {
            local asset="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" "$asset" --clobber; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Upload failed for $asset; retrying in $((attempt * 10))s" >&2
                sleep $((attempt * 10))
              fi
            done
            echo "Unable to upload $asset after 3 attempts" >&2
            return 1
          }
          while IFS= read -r -d '' asset; do
            upload_asset "$asset"
          done < <(find release-assets -type f ! -name 'latest.json' -print0)
          upload_asset release-assets/latest.json
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            })
