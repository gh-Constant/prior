name: SonarQube

# Needs SONAR_TOKEN (a SonarQube Cloud token for this project) stored as a
# repository secret, plus sonar.organization set in sonar-project.properties.
# The job skips silently until both exist, so CI stays green before setup.
# One-time setup: import gh-Constant/prior at sonarcloud.io (free OSS plan
# for public repos), copy the project key + organization into
# sonar-project.properties, and save the token as SONAR_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sonar:
    if: ${{ secrets.SONAR_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: pnpm install --frozen-lockfile=false
        working-directory: app
      - run: pnpm vitest run --coverage
        working-directory: app
      - run: go test ./... -coverprofile=coverage.out
        working-directory: server
      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
