# SonarQube analysis configuration for Prior.
# Local scans: sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
# CI (SonarQube Cloud): set SONAR_TOKEN secret + sonar.organization, see .github/workflows/sonar.yml

sonar.projectKey=gh-constant_prior
sonar.projectName=prior
sonar.projectVersion=0.3.25
sonar.sourceEncoding=UTF-8

# Sources: shared React client, Go API, Tauri Rust shell.
sonar.sources=app/src,server,app/src-tauri/src
sonar.tests=app/src,server
sonar.test.inclusions=**/*.test.{ts,tsx},**/*_test.go

# Never scan generated code, build output, or vendored artifacts.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/gen/android/**,\
  **/*.lock,\
  **/pnpm-lock.yaml,\
  **/go.sum,\
  **/*.tsbuildinfo,\
  app/src/vite-env.d.ts
sonar.coverage.exclusions=\
  **/*.test.{ts,tsx},\
  **/*_test.go,\
  **/mocks/**,\
  server/cmd/**

# Coverage reports (generated by CI / local scripts, see sonar.yml).
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.go.coverage.reportPaths=server/coverage.out

# Rust is analyzed natively (Clippy runs automatically during analysis).
sonar.rust.cargo.manifestPaths=app/src-tauri/Cargo.toml
