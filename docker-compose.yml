services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prior
      POSTGRES_USER: prior
      POSTGRES_PASSWORD: prior
    ports:
      - "5432:5432"
    volumes:
      - prior-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prior -d prior"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prior-postgres:
