services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prior
      POSTGRES_USER: prior
      POSTGRES_PASSWORD: prior
    ports:
      - "5432:5432"
    volumes:
      - prior-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prior -d prior"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://prior:prior@postgres:5432/prior?sslmode=disable
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  prior-postgres:
