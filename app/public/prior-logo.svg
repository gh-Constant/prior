<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="prior-grad-obsidian" x1="200" y1="200" x2="600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2522" />
      <stop offset="100%" stop-color="#141211" />
    </linearGradient>
    <linearGradient id="prior-grad-coral" x1="160" y1="180" x2="820" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b62" />
      <stop offset="45%" stop-color="#fa654a" />
      <stop offset="100%" stop-color="#d63f25" />
    </linearGradient>
    <linearGradient id="prior-grad-cream" x1="250" y1="500" x2="450" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6ebd9" />
      <stop offset="100%" stop-color="#ebd1b5" />
    </linearGradient>
    <filter id="prior-fold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>
  <!-- Outer charcoal loop of the P -->
  <path d="M 320 200 C 320 200, 520 200, 680 200 C 820 200, 880 320, 880 440 C 880 560, 800 660, 640 660 C 520 660, 420 660, 420 660 L 420 500 C 420 500, 500 500, 600 500 C 680 500, 720 460, 720 430 C 720 400, 680 360, 600 360 L 320 360 Z" fill="url(#prior-grad-obsidian)" />
  <!-- Cream lower spine / counter -->
  <path d="M 320 500 C 370 500, 420 540, 420 600 L 420 800 C 420 850, 370 880, 320 880 C 270 880, 240 850, 240 800 L 240 600 C 240 540, 280 500, 320 500 Z" fill="url(#prior-grad-cream)" />
  <!-- Vibrant Coral Fold Ribbon -->
  <path filter="url(#prior-fold-shadow)" d="M 280 200 C 220 200, 180 250, 180 320 C 180 420, 260 500, 380 560 L 560 650 C 620 680, 660 640, 660 580 C 660 520, 600 480, 520 440 L 380 360 C 320 320, 320 240, 380 220 C 410 210, 350 200, 280 200 Z" fill="url(#prior-grad-coral)" />
</svg>