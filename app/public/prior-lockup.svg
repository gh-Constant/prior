      <stop offset="100%" stop-color="#ebd1b5" />
    </linearGradient>
    <filter id="prior-lockup-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.32" />
