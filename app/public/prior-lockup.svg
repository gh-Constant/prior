<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <linearGradient id="prior-lockup-obsidian" x1="200" y1="200" x2="600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2522" />
      <stop offset="100%" stop-color="#141211" />
    </linearGradient>
    <linearGradient id="prior-lockup-coral" x1="160" y1="180" x2="820" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b62" />
